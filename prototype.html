<style>
/* Идея: телефон цеха в рамке, рядом пульт настройки прототипа: роль, что показывать на карточке, размер кнопок, замечания. */
:root{
  --bg:#e7ebe8; --panel:#ffffff; --ink:#15201d; --mut:#586964; --line:#d3dbd7;
  --acc:#1d6b58; --acc-ink:#fff; --acc-soft:#dcefe8;
  --warn:#8a5200; --warn-soft:#fdf0d5; --bad:#b0281c; --bad-soft:#fbe3e0;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --btn-h:46px; --fs:15px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --panel:#17211e; --ink:#e6eeea; --mut:#9fb0aa; --line:#2a3a35;
  --acc:#4cc3a3; --acc-ink:#06231b; --acc-soft:#17372f; --warn:#f0b45a; --warn-soft:#3a2c10; --bad:#ff8d80; --bad-soft:#3d1b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --panel:#17211e; --ink:#e6eeea; --mut:#9fb0aa; --line:#2a3a35;
  --acc:#4cc3a3; --acc-ink:#06231b; --acc-soft:#17372f; --warn:#f0b45a; --warn-soft:#3a2c10; --bad:#ff8d80; --bad-soft:#3d1b17; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{margin-bottom:14px}
header.top h1{font-size:24px}
.hint{font-size:13px;color:var(--mut)}
.layout{display:grid;grid-template-columns:420px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.phone{width:100%}.pult{order:-1}}
/* пульт */
.pult{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:16px}
.roles{display:flex;flex-wrap:wrap;gap:6px}

.roles button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:500}
.notes{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.nt{border-left:3px solid var(--acc);padding:2px 8px;font-size:14px}
.nt small{color:var(--mut);display:block}
.status{font-size:13px;color:var(--mut)}
/* телефон */
.phone{width:410px;max-width:100%;background:#0f1714;border:3px solid #2a3a35;border-radius:28px;padding:10px;position:relative;justify-self:center}
.screen{background:#f3f4f1;color:#15201d;border-radius:18px;overflow:hidden;position:relative;height:760px;display:flex;flex-direction:column;font-size:var(--fs)}
.app-top{background:#111827;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;font-family:var(--font-head);font-size:18px}
.app-top .who{margin-left:auto;font:13px var(--font-body);color:#c7d0cb}
.body{flex:1;overflow:auto;padding:12px 12px 16px}
.tabbar{display:flex;border-top:1px solid #d6dbd7;background:#fff}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:#5c6b66;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}

.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cell{background:#f4f6f3;border-radius:8px;padding:4px 7px;min-width:0}.cell small{display:block;color:#5c6b66;font-size:11px}.cell b{font-size:14px;font-weight:500;overflow-wrap:anywhere}.cells2{display:grid;grid-template-columns:1fr 1fr;gap:8px}input.inl,textarea.inl{width:100%;border:1px solid #c9cfca;border-radius:8px;padding:8px;min-height:var(--btn-h);background:#fff;color:#15201d}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;text-align:left;border-radius:18px;padding:12px 14px;background:#fffdf9;box-shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.06);cursor:pointer;display:flex;flex-direction:column;gap:2px;color:#2b1f18}.tile b{font:600 30px var(--font-head)}.tile span{font-size:13px;color:#7a6657}.tile.bad{background:#fbd9d3}.tile.warn{background:#fde8b8}.tile.ok{background:#dcefdf}.srow{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}.bar{height:8px;border-radius:4px;background:#e5dccf;overflow:hidden}.bar i{display:block;height:100%}.bar.roast i{background:#c2602b}.bar.label i{background:#e0b020}.bar.pack i{background:#3d83c9}.bar.ship i{background:#3d9a5b}.ocard.lnk{border:0;text-align:left;width:100%;cursor:pointer;margin-bottom:10px;color:#2b1f18}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1.5px solid #d8cdbf;background:#fffdf9;border-radius:20px;padding:6px 12px;color:#4a3a2e;cursor:pointer}.chip.on{background:#2b1f18;color:#fff;border-color:#2b1f18}.empty{text-align:center;color:#5c6b66;padding:30px 10px}
table.gr{width:100%;border-collapse:collapse;font-size:14px}
table.gr td,table.gr th{padding:6px 4px;border-bottom:1px solid #e3e6e3;text-align:left}

/* ===== редизайн экрана телефона: тёплая палитра, крупные карточки ===== */

.ocard.hold{background:#fff6e4}.ocard.lock{background:#f1ebe4;opacity:.85}
.num{font-size:22px;letter-spacing:.01em}
.pill{background:#efe7dc;color:#4a3a2e;font-weight:500;padding:3px 10px}
.pill.ok{background:#dcefdf;color:#1d6a3a}.pill.warn{background:#fde8b8;color:#7a4a00}.pill.bad{background:#fbd9d3;color:#a32116}.pill.blue{background:#e1e9f5;color:#25466f}
.steps{display:flex;gap:4px;margin:2px 0 4px}
.stp{flex:1;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:#9a8878;text-align:center}
.stp i{height:5px;border-radius:3px;background:#e5dccf}
.stp.d i{background:#6bb58a}.stp.c i{background:#d9822b}.stp.c{color:#2b1f18;font-weight:600}
.b{border-radius:14px;border:1.5px solid #d8cdbf;background:#fffdf9;min-height:var(--btn-h)}
.b.g{background:#2b1f18;border-color:#2b1f18;color:#fff;font-size:1.05em;font-weight:600}

.blk.roast{border-color:#c2602b}.blk.label{border-color:#e0b020}.blk.pack{border-color:#3d83c9}.blk.ship{border-color:#3d9a5b}.blk.done{border-color:#aaa}
.blk i{background:#2b1f18;color:#fff;font-weight:600}
.tabbar{background:#fffdf9;border-top:0;box-shadow:0 -6px 20px rgba(60,40,20,.08);padding:6px 8px 8px;gap:4px}

.tabbar button[aria-selected="true"]{background:#2b1f18;color:#fff}
.daynav .b{border-radius:14px}
.sheet{background:#fffdf9;border-radius:26px 26px 0 0}
.sheet input,.sheet textarea,.sheet select,input.inl,textarea.inl{border:1.5px solid #d8cdbf;border-radius:14px;background:#fff}
.opt{border-radius:14px;border-width:1.5px}.opt.on{border-color:#2b1f18;background:#f1ebe4}
.reqbox,.cell{background:#f5efe6;border-radius:12px}
.b.on{background:#2b1f18;color:#fff;border-color:#2b1f18}.hl{background:#fde58a;border-radius:6px;padding:0 5px}.bigchk{width:28px;height:28px;accent-color:#2b1f18;flex:none}.prow{display:grid;grid-template-columns:1fr 92px;gap:8px 12px;align-items:center}.pchk{display:flex;gap:12px;align-items:center;cursor:pointer}.prow.pok{background:#eef7ef}.prow.pshort{background:#fff1ee}.pq{display:flex;flex-direction:column;gap:2px}.qin{padding:6px 8px;min-height:44px}.sheet .plist,.plist{flex:none}.plist{background:#fff;border:1px solid #e6dfd3;border-radius:12px;overflow:hidden}.pl{display:grid;grid-template-columns:20px 1fr auto 30px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #eee7db}.pl:last-child{border-bottom:0}.pl input[type=checkbox]{width:20px;height:20px;accent-color:#2b1f18;margin:0}.pl.pok{background:#f3f9f4}.pl.pbad{background:#fff3ef}.pn{font-size:14px;line-height:1.25;min-width:0}.pn small{display:block;color:#b3261e}.pv{font-size:14px;white-space:nowrap}.dots{width:30px;height:30px;border:1px solid #d8cfc0;border-radius:8px;background:#fff;font-size:18px;line-height:1;padding:0;cursor:pointer}.lt{display:flex;flex-direction:column;gap:2px;font-size:14px}.lr{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:3px 0;border-bottom:1px dashed #e6dfd3}.lr:last-child{border-bottom:0}.ln{min-width:0}.lq{font-weight:700;white-space:nowrap}.lw{color:#6b5f50;white-space:nowrap;min-width:64px;text-align:right}.link{background:none;border:0;color:#2b5d8a;padding:4px 0;font-size:13px;cursor:pointer;align-self:flex-start}.erow{display:grid;grid-template-columns:1fr 70px 30px;gap:6px}.boxbig{font-weight:700;font-size:17px;background:#d3ecd3;border-radius:10px;padding:6px 12px;align-self:flex-start}.stack{display:flex;flex-direction:column;gap:8px}.stack .b{flex:none;width:100%}.stack .row .b{width:auto;flex:0 0 auto;padding:4px 16px}.toast{background:#2b1f18;border-radius:14px}.acts .b.g{flex:2.2;white-space:nowrap}.acts .b.s{padding:4 <body>
<div class="wrap">
  <header class="top">
    <h1>Прототип интерфейса цеха</h1>
    <div class="hint">Кликабельный макет на выдуманных данных. Выберите роль справа, пройдите её день, а неудобное запишите в замечания: они сохранятся и я их прочитаю. В макете есть то, чего в платформе ещё нет: допуск «Грузим», Честный знак, база, недовоз, остаток зерна.</div>
  </header>
  <div class="layout">
    <div class="phone"><div class="screen" id="screen"></div></div>
    <aside class="pult" id="pult"></aside>
  </div>
</div>
<script>
"use strict";
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);

    if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (["value", "checked", "disabled", "selected"].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }

  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ============================================================ справочники */

];
